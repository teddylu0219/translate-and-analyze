name: Release

# 推 v* tag（例如 v0.1.0）就會在 Windows 上建置安裝檔並發到 GitHub Releases
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check version matches tag
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "package.json version v$v != tag $GITHUB_REF_NAME"; exit 1; fi
      - run: npm run dist
      # 安裝檔、blockmap 與 latest.yml（自動更新用）一次上傳
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files="dist/*.exe dist/*.exe.blockmap dist/latest.yml"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files --title "$GITHUB_REF_NAME" --notes-file .github/release-notes.md
          fi
