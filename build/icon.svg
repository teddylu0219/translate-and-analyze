<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B5BDB"/>
      <stop offset="1" stop-color="#1E2A78"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9EDFB"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC94D"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B1240" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 底板 -->
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#sheen)"/>

  <!-- 文件 -->
  <g filter="url(#shadow)">
    <path d="M300 214 h300 l140 140 v432 a34 34 0 0 1 -34 34 h-406 a34 34 0 0 1 -34 -34 v-538 a34 34 0 0 1 34 -34 z" fill="url(#page)"/>
    <path d="M600 214 v106 a34 34 0 0 0 34 34 h106 z" fill="#C5CEF0"/>
  </g>

  <!-- 文字行，其中一行被螢光筆畫線 -->
  <rect x="338" y="420" width="250" height="26" rx="13" fill="#B7C2E8"/>
  <rect x="320" y="488" width="356" height="58" rx="14" fill="#FFD43B" opacity="0.9"/>
  <rect x="338" y="504" width="320" height="26" rx="13" fill="#5466B8"/>
  <rect x="338" y="588" width="300" height="26" rx="13" fill="#B7C2E8"/>
  <rect x="338" y="656" width="200" height="26" rx="13" fill="#B7C2E8"/>

  <!-- 翻譯徽章 -->
  <g filter="url(#shadow)">
    <circle cx="716" cy="716" r="148" fill="url(#badge)"/>
  </g>
  <circle cx="716" cy="716" r="148" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="10"/>
  <text x="716" y="718" text-anchor="middle" dominant-baseline="central"
        font-family="Microsoft JhengHei, Microsoft YaHei, sans-serif" font-weight="700" font-size="170" fill="#1E2A78">譯</text>
</svg>
